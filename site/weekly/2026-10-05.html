hapter shifts focus to public markets, which provide liquidity and help recycle capital back into new ventures as start-ups mature. The first two chapters develop and estimate an equilibrium model of staged financing in venture capital. The model features frictional matching between venture capitalists and start-ups and focusses on the use of staged financing to overcome a simple principal-agent problem. In the model, some firms fail due to commercial or technological challenges, while others are forced to shut down prematurely due to issues in securing follow-on fi- nancing. A number of insights emerge from the analysis: some projects are more diﬀicult to finance than others, particularly more novel and long-horizon projects; venture capital contracts generate a novel contracting externality through their effect on future meeting rates in the financing market, implying that they are generally ineﬀicient; and funding histories encode information about both project characteristics and the funding envi- ronment, which forms the basis for identifying the model’s structural parameters from observable features of contracts. Estimating the model on US data, I argue that a substantial share of venture-backed firms appear to shut down prematurely, pointing to significant leakage from the innovation pipeline. Across countries, I find that differences in venture capital activity between the US and UK reflect tighter financing conditions and limited acquisition opportunities in the UK, rather than lower-quality projects. Through counterfactuals, I argue that existing government support in the UK venture capital market would be better focussed on later-stage start-ups, rather than the traditional focus on early-stage firms. The final chapter, which reflects joint work with Igli Bajo, studies the role that stock markets play in domestic economies. In a two-country model, firms make endogenous entry decisions and can list on a domestic or foreign exchange, understanding that thei s sustain performance when uncertainty arises from market crises, technological change, cyber threats, fragmented institutions, financing constraints, and bounded rationality. METHODOLOGY: We conduct an integrative narrative synthesis of the six articles in this Issue and map their theoretical lenses, levels of analysis, methods, and findings into a cross-level framework, and future research directions. FINDINGS: We identify four interdependent domains of adaptive performance: resources and financing, human and behavioral capabilities, governance and risk architecture, and institutional and ecosystem embeddedness. Across the studies, access to finance and technology is enabling but not sufficient. Outcomes depend on how resources are converted through learning, managerial discipline, institutional connectivity, and context-appropriate risk measurement. Digitalization is simultaneously a source of efficiency and a source of cyber and organizational exposure. The studies also show that average effects conceal meaningful heterogeneity across regions, sectors, firm sizes, lifecycle stages, employee groups, and crisis types. IMPLICATIONS: Research should move from isolated determinants toward multilevel, longitudinal, and configurational designs. Managers and policymakers should align resources, capabilities, governance, and institutional support rather than optimize any single factor. ORIGINALITY & VALUE: The paper integrates employee readiness, entrepreneurial decision-making, innovation, startup financing, cybersecurity, and downside portfolio risk into a single adaptive-performance architecture and derives a focused research agenda.", "cited_by": 0, "concepts": ["Corporate governance", "Portfolio", "Interdependence", "Business", "Downside risk", "Entrepreneurial finance", "Originality", "Venture capital", "Industrial organization", "Economics", "Human resources", "Knowledge management", "Risk management", "Project portfolio management", "Productivity", "Finance", "Dy function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function tierBadge(d){

  return '';
}
function cardHtml(d){

    <div class="row">${esc(d.venue||'NA')} (${d.year||'NA'}) · ${esc(authors)} · 인용 ${d.cited_by||0}${d.doi?` · <a href="${esc(d.url)}" target="_blank">DOI</a>`:''}</div>

    ${su.dependent_var?`<div class="kv"><b>종속변수</b> ${esc(su.dependent_var)}</div>`:''}

    ${su.caveats?`<div class="kv caveat"><b>⚠️ 유의점</b> ${esc(su.caveats)}</div>`:''}

    ${d.abstract?`<div class="en"><b>Abstract.</b> ${esc(d.abstract)}</div>`:''}

}
