eneurial Finance, Corporate Governance)", "is_canon": false, "summary": {"summary": "(초록 없음 — DOI 링크에서 확인)", "key_result": "", "dependent_var": "exit", "independent_var": "", "method": "", "caveats": ""}}, {"title": "Essays on entrepreneurial finance : internationalization and corporate governance", "doi": "10.63028/10067/2255300151162165141", "authors": ["Nina Marien"], "year": 2026, "venue": null, "url": "https://doi.org/10.63028/10067/2255300151162165141", "abstract": "Entrepreneurial firms drive innovation, employment, and economic growth, yet their ambitions usually exceed their internal resources. They need capital to develop products, build an organization, and expand abroad long before they generate cash flows to fund these activities themselves. For these firms, raising capital is never just about money: each source of finance carries a different mix of ownership, incentives, expertise, and control rights. This dissertation examines how the financing of entrepreneurial firms shapes two outcomes central to their development: internationalization and corporate governance. It brings together three complementary studies. The first study is a systematic review of 112 articles published over three decades, connecting the literatures on entrepreneurial finance and international entrepreneurship. The second study compares 602 UK firms that raised equity through crowdfunding with 602 comparable firms that did not, examining how this financing event affects board size. The third study follows 101,202 Italian new ventures for up to five years after incorporation to establish when boards form and how having a board relates to firm growth and survival. The first study shows that research has concentrated on venture capital and exporting, leaving other financing sources and forms of foreign expansion largely unexplored. The second study finds that equity crowdfunding is followed by a lasting increase in board size. Unlike venture capital or private equity investors, equity crowdfunding investors individually hold stakes that are too small to make monitoring worthwhile and are collectively too dispersed to do so effectively. Yet firms still expand their boards. This increase persists when the comparison is limited to firms that raised new capital by other means, indicating that it cannot be explained by the capital injection alone. The effect is strongest in firms without venture capital or private equity investors, whose direct monitoring can otherwise substitute for additional directors. In the third study, boards in Italian new ventures emerge as firms grow larger, older, and more widely owned, but also shortly before firms cease operations. Boards are thus not simply mechanisms intended to improve performance; they are also responses to firms’ existing circumstances. The familiar association between boards and outcomes partly reflects which firms adopt them. Financing decisions are, in this sense, also decisions about who governs the firm and when. By linking entrepreneurial finance to internationalization and board formation, this dissertation offers a more integrated understanding of how young firms are financed and governed, with implications for researchers, entrepreneurs, investors, crowdfunding platforms, and policymakers.", "cited_by": 0, "concepts": ["Venture capital", "Internationalization", "Corporate governance", "Finance", "Equity (law)", "Corporate finance", "Private equity", "Business", "Entrepreneurial finance", "Entrepreneurship", "Control (management)", "Capital (architecture)", "Economics", "Accounting", "External financing", "Equity crowdfunding", "Cash", "Equity capital markets", "Private equity firm", "Internal financing", "Capital structure", "Private equity fund", "Initial public offering", "Market economy", "Capital market", "New Ventures", "Financial system", "Cash flow", "Social venture capital", "Financial capital"], "relevance": 100, "reason": "키워드 3개 일치 (Venture Capital, Entrepreneurial Finance, Corporate Governance)", "is_canon": false, "summary": {"summary": "Entrepreneurial firms drive innovation, employment, and economic growth, yet their ambitions usually exceed their internal resources. They need capital to develop products, build an organization, and expand abroad long before they generate cash flows to fund these activities themselves.…", "key_result": "", "dependent_var": "생존", "independent_var": "성장, 기업지배구조, 이사회", "method": "", "caveats": ""}}, {"title": "Relationship between Entrepreneurial Finance and Success of High Tech Young Entrepreneurial Firms: The Role of Funding Structure and Governance Characteristics", "doi": "10.36828/thesis/15307", "authors": ["Farshad Eshragi"], "year": 2026, "venue": null, "url": "https://doi.org/10.36828/thesis/15307", "abstract": "High Tech Young Entrepreneurial Firms (HTYEFs) are widely recognised as critical drivers of economic growth and technological advancement. They rely substantially on external equity financing, yet there are gaps in the understanding of how to structure such funding to optimise value creation and innovation outcomes. This thesis presents a quantitative empirical investigation of how external equity funding patterns and resulting governance structures have influenced performance and innovation outcomes in HTYEFs in the UK. Integrating agency theory and signalling theory, this study asks two research questions, using a bespoke governance architecture framework to explore how governance dimensions driven by funding choices—investor heterogeneity, insider ownership, and ownership concentration—impact firm performance and innovation. Drawing on panel data from 400 UK HTYEF for the period 2018 to 2023, the quantitative analysis employs longitudinal regression models to analyse performance outcomes (financial assets and employment growth) and cross-sectional models to interrogate innovation outcomes (patents and IP activity scores). Six hypotheses test competing theoretical mechanisms to determine ely recognised as critical drivers of economic growth and technological advancement. They rely substantially on external equity financing, yet there are gaps in the understanding of how to structure such funding to optimise value creation and inn…", "key_result": "", "dependent_var": "", "independent_var": "성장, 기업지배구조, 신호", "method": "패널분석, 회귀분석", "caveats": "횡단면: 상관≠인과"}}, {"title": "FinTech Innovation and Alternative Financing Models for Startup Growth", "doi": "10.4018/979-8-3373-9574-6.ch004", "authors": ["Pradeep Yadav"], "year": 2026, "venue": null, "url": "https://doi.org/10.4018/979-8-3373-9574-6.ch004", "abstract": "The integration between FinTech and behavioral economics changes the face of startup funding by broadening the availability of funds beyond conventional banking networks. This chapter analyzes the impact of FinTech trends like AI-powered lending, equity crowdfunding, revenue-based financing, DeFi, and open banking on decision-making among entrepreneurs and investors. Utilizing ideas from prospect theory, hyperbolic discounting, herding, and nudging, this chapter creates a model that correlates behavioral biases and FinTech platform design. It demonstrates how FinTech platforms can mitigate cognitive biases that restrict startup funding options. Examples of FinTech environments worldwide in North America, Europe, Asia-Pacific, Africa, and Latin America reveal variations in FinTech adoption and regulations among regions. Further research topics for this study include algorithmic bias, cross-cultural behavioral biases, and CBDCs in startup finance.", "cited_by": 0, "concepts": ["FinTech", "Equity (law)", "Business", "Behavioral economics", "Finance", "Economics", "Equity crowdfunding", "Face (sociological concept)", "Behavioral modeling", "Venture capital", "Latin Americans", "Entrepreneurship", "Industrial organization", "Entrepreneurial finance", "Financial innovation", "Business model", "Behavioral analysis"], "relevance": 100, "reason": "키워드 3개 nd investor protection. Future directions emphasize integrating cross-disciplinary approaches to address scalability, regulation, and behavioral aspects, ensuring ICOs and DeFi sustainably support entrepreneurial ventures globally.", "cited_by": 1, "concepts": ["Business", "Finance", "Cryptocurrency", "Venture capital", "Capital (architecture)", "Financial system", "Investment (military)", "Economics", "Commerce", "Work (physics)", "Financial capital"], "relevance": 89, "reason": "키워드 2개 일치 (Venture Capital, Entrepreneurial Finance) · 인용 1", "is_canon": false, "summary": {"summary": "This study examines Initial Coin Offerings (ICOs) and Decentralized Finance (DeFi) as emerging tools in entrepreneurial finance, leveraging blockchain technology and smart contracts to enhance transparency and accessibility for investors, and also examines stablecoin trends that reveal investor pref…", "key_result": "", "dependent_var": "", "independent_var": "성장", "method": "", "caveats": ""}}, {"title": "Crowdfunding as an alternative source of startup financing", "doi": "10.29119/1641-3466.2025.226.18", "authors": ["Dariusz Firszt"], "year": 2025, "venue": "Scientific Papers of Silesian University of Technology Organization and Management Series", "url": "https://doi.org/10.29119/1641-3466.2025.226.18", "abstract": "Purpose: The aim of this article is to assess the suitability of crowdfunding – as an alternative source of business financing – for addressing the specific needs of startup ventures. Design/methodology/approach: The study is based on expert evaluation using the Best-Worst Method (BWM), which allows for a structured assessment of crowdfunding's usefulness in raising capital for startup development. The analysis is supplemented by desk research focusing on the dynamics of the crowdfunding market in Poland. Findings: The results indicate a high level of alignment between crowdfunding and the needs of startups. Crowdfunding performs significantly better than traditional bank
